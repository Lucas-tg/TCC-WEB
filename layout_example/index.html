<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
</head>

<body>
  <div class="card_test">
    <div class="card-header">
      <h2 class="card-title">
        Título do cartão
        <a href="#" class="icon-link"><i class="fa-solid fa-ellipsis-vertical"></i></a>
      </h2>
    </div>
    <div class="card-body">
      <p>Descrição do cartão</p>
    </div>
  </div>

  <div class="card_test">
    <div class="card-header">
      <h2 class="card-title">
        Título do cartão
        <a href="#" class="icon-link"><i class="fa-solid fa-ellipsis-vertical"></i></a>
      </h2>
    </div>
    <div class="card-body">
      <p>Descrição do cartão</p>
    </div>
  </div>


  <div id="">
    <div class="card_test2">  
      <div class="list">
        <div class="title removable editable">Lista 1</div>
        <div class="content">
          <div class="card removable editable">Cartao 1</div>
          <div class="card removable editable">Cartao 2</div>
          <div class="card removable editable">Cartao 3</div>
          <div class="card removable editable" style="">Cartao 4</div>
        </div>
        <div class="add-card editable">Adicionar novo cartao</div>
      </div>
      <div class="list">
        <div class="title removable editable">Lista 2</div>
        <div class="content">
          <div class="card removable editable">cartao 5</div>
        </div>
        <div class="add-card editable">Adicionar novo cartao</div>
      </div>
      <div class="list">
        <div class="title removable editable">Lista vazia</div>
        <div class="content"></div>
        <div class="add-card editable">Adicionar novo cartao</div>
      </div>
    </div>



    <script>
        $(document).ready(function() {
          $(".card").draggable({
            containment: ".list", // Restringir o arrasto aos elementos com classe "list"
            helper: "clone",
          });
    
          $(".list .content").droppable({
            accept: ".card",
            drop: function(event, ui) {
              $(this).append(ui.helper);
            },
          });
        });
      </script>

</body>

</html>
