<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registration</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
	      integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">

	<script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
	        integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
	        crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

	<script type="text/javascript" src="../js/user_register.js"></script>

</head>
<body>
	<div class="container text-center">
		<div class="row">
			<div class="col"></div>
			<div class="col-6 card">
				<div class="card-header">
					<h3>Cadastrar:</h3>
				</div>
				<div class="card-body">
					<form>

						<div class="mb-3">
							<label for="nome_user_registration" class="form-label">Nome:</label>
							<input type="text" class="form-control" id="nome_user_registration">
						</div>

						<div class="mb-3">
							<label for="email_user_registration" class="form-label">Email:</label>
							<input type="email" class="form-control" id="email_user_registration"
							       aria-describedby="emailHelp">
						</div>
						<div class="mb-3">
							<label for="password_user_registration" class="form-label">Senha:</label>
							<input type="password" class="form-control" id="password_user_registration">
						</div>

						<button type="button" class="btn btn-primary" id="submit_user_registration">Registrar</button>

					</form>
				</div>
			</div>
			<div class="col"></div>
		</div>
	</div>


</body>
</html>
