<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace</title>



  <link rel="stylesheet" href="../css/main.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">

  <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
    crossorigin="anonymous"></script>

  <!--<script type="text/javascript" src="../js/main.js"></script> -->
  <script type="text/javascript" src="../js/api/workspace.js"></script>
  <script type="text/javascript" src="../js/app.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

</head>

<body style="padding-top: 70px;">

  <nav class="navbar fixed-top navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <form class="form-inline">
            <div class="form-group">
              <label for="connect">WebSocket test connection:</label>
              <button id="connect" class="btn btn-default" type="submit">Connect</button>
              <button id="disconnect" class="btn btn-default" type="submit" disabled="disabled">Disconnect
              </button>
            </div>
          </form>
        </ul>
          <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
            Criar Nova Área de Trabalho
          </button>
      </div>
    </div>
  </nav>

  <div id="mensagemSucesso" class="alert alert-success" style="display: none;">
    Área de trabalho criada com sucesso!
  </div>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Criar Nova Área de Trabalho</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="workspaceNameNewProject" class="form-label">Nome:</label>
            <input type="text" class="form-control" id="workspaceNameNewProject">
          </div>
          <div class="mb-3">
            <label for="workspaceDescriptionNewProject" class="form-label">Descrição:</label>
            <input type="text" class="form-control" id="workspaceDescriptionNewProject">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        <button id="workspaceInsert" type="submit" class="btn btn-primary">Criar</button>
      </div>
    </div>
  </div>
</div>


  <div id="workspaces_teste"></div>

  <div class="row">
    <div id="tables" class="col-md-12">
    </div>
  </div>

</body>

</html>
